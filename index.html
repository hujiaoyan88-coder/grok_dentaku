<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💥 GROK BOOM CALC 💥</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .display { font-family: 'Space Grotesk', monospace; }
  
  .calc-btn {
    position: relative; overflow: hidden;
    transition: transform 0.1s cubic-bezier(0.23,1,0.32,1);
  }
  .calc-btn:active { transform: scale(0.88) !important; }
  
  .ripple {
    position: absolute; border-radius: 50%;
    background: rgba(251, 191, 36, 0.7);
    animation: ripple-boom 0.55s linear forwards;
    pointer-events: none;
  }
  @keyframes ripple-boom { to { transform: scale(4.5); opacity: 0; } }
  
  .big-flash { animation: big-flash-anim 0.45s ease; }
  @keyframes big-flash-anim {
    0% { filter: brightness(1); }
    30% { filter: brightness(3.5) saturate(2.5); }
    100% { filter: brightness(1); }
  }
  
  .earthquake {
    animation: earthquake-anim 0.55s ease;
  }
  @keyframes earthquake-anim {
    0%,100% { transform: translate(0,0); }
    10% { transform: translate(-8px, -4px); }
    20% { transform: translate(8px, 5px); }
    30% { transform: translate(-7px, 3px); }
    40% { transform: translate(7px, -5px); }
    50% { transform: translate(-5px, 3px); }
    60% { transform: translate(5px, -3px); }
  }
</style>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-3">
  <div id="main-container" class="w-full max-w-[360px]">
    <div class="flex items-center gap-2 mb-3 px-1">
      <div class="text-4xl">💥</div>
      <div>
        <h1 class="text-3xl font-black tracking-tighter text-white">GROK</h1>
        <h2 class="text-xl font-bold tracking-[-1px] bg-gradient-to-r from-amber-400 to-yellow-500 bg-clip-text text-transparent -mt-1">BOOM CALC</h2>
      </div>
    </div>

    <div class="relative bg-zinc-900/95 backdrop-blur-2xl border border-amber-500/30 rounded-3xl p-5 shadow-2xl">
      <canvas id="particles" class="absolute inset-0 rounded-3xl pointer-events-none z-0"></canvas>
      
      <div id="display" 
           class="display relative z-10 h-24 flex items-end justify-end px-6 text-right text-5xl font-black tracking-[-3px] bg-black/70 rounded-2xl border border-amber-500/20 mb-6 text-white">
        0
      </div>

      <div class="relative z-10 grid grid-cols-4 gap-3">
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xl py-5 rounded-2xl" data-action="clear">AC</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xl py-5 rounded-2xl" data-action="sign">±</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xl py-5 rounded-2xl" data-action="percent">%</button>
        <button class="calc-btn bg-orange-950 hover:bg-orange-900 text-orange-400 text-3xl py-5 rounded-2xl" data-operator="/">÷</button>

        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 text-white text-3xl py-5 rounded-2xl" data-value="7">7</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 text-white text-3xl py-5 rounded-2xl" data-value="8">8</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 text-white text-3xl py-5 rounded-2xl" data-value="9">9</button>
        <button class="calc-btn bg-orange-950 hover:bg-orange-900 text-orange-400 text-3xl py-5 rounded-2xl" data-operator="*">×</button>

        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 text-white text-3xl py-5 rounded-2xl" data-value="4">4</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 text-white text-3xl py-5 rounded-2xl" data-value="5">5</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 text-white text-3xl py-5 rounded-2xl" data-value="6">6</button>
        <button class="calc-btn bg-orange-950 hover:bg-orange-900 text-orange-400 text-3xl py-5 rounded-2xl" data-operator="-">−</button>

        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 text-white text-3xl py-5 rounded-2xl" data-value="1">1</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 text-white text-3xl py-5 rounded-2xl" data-value="2">2</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 text-white text-3xl py-5 rounded-2xl" data-value="3">3</button>
        <button class="calc-btn bg-orange-950 hover:bg-orange-900 text-orange-400 text-3xl py-5 rounded-2xl" data-operator="+">+</button>

        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 text-white text-3xl py-5 rounded-2xl col-span-2" data-value="0">0</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 text-white text-3xl py-5 rounded-2xl" data-value=".">.</button>
        <button class="calc-btn bg-gradient-to-br from-amber-400 to-yellow-500 text-zinc-950 text-4xl font-black py-5 rounded-2xl shadow-lg" data-action="equals">=</button>
      </div>
    </div>
  </div>

<script>
// パーティクル
let canvas, ctx, particles = [];
function initParticles() {
  canvas = document.getElementById('particles');
  ctx = canvas.getContext('2d');
  const resize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
  resize();
  window.addEventListener('resize', resize);
  
  for (let i = 0; i < 35; i++) {
    particles.push(createParticle(Math.random()*canvas.width, Math.random()*canvas.height, (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, Math.random()*2+1, 200, '#fcd34d'));
  }
}
function createParticle(x,y,vx,vy,size,life,color) {
  return {x,y,vx,vy,size,life,maxLife:life,color,gravity:0.03};
}
function createExplosion(x, y, count=45, speed=6) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const vel = Math.random() * speed + 2;
    particles.push(createParticle(
      x, y,
      Math.cos(angle)*vel,
      Math.sin(angle)*vel - 2,
      Math.random()*3.5 + 1.5,
      38 + Math.random()*22,
      Math.random() > 0.6 ? '#fef08c' : '#fcd34d'
    ));
  }
}
function updateParticles() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.gravity;
    p.life--;
    if (p.life <= 0) { particles.splice(i,1); continue; }
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a * 0.95;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 12; ctx.shadowColor = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  requestAnimationFrame(updateParticles);
}

// シェイク
function bigBoomShake() {
  const c = document.getElementById('main-container');
  c.classList.add('earthquake');
  setTimeout(() => c.classList.remove('earthquake'), 600);
}

// ロジック
let displayValue = '0', firstOperand = null, waitingForSecondOperand = false, currentOperator = null;
const display = document.getElementById('display');
function updateDisplay() { display.textContent = displayValue; }

function inputDigit(d) {
  if (waitingForSecondOperand) { displayValue = d; waitingForSecondOperand = false; }
  else displayValue = displayValue === '0' ? d : displayValue + d;
  updateDisplay();
}
function inputDecimal() {
  if (waitingForSecondOperand) displayValue = '0.';
  else if (!displayValue.includes('.')) displayValue += '.';
  waitingForSecondOperand = false;
  updateDisplay();
}
function handleOperator(op) {
  const val = parseFloat(displayValue);
  if (currentOperator && waitingForSecondOperand) { currentOperator = op; return; }
  if (firstOperand === null) firstOperand = val;
  else if (currentOperator) {
    const res = calc(firstOperand, val, currentOperator);
    displayValue = res === 'Error' ? 'Error' : parseFloat(res.toFixed(7)).toString();
    firstOperand = res === 'Error' ? null : res;
    updateDisplay();
  }
  waitingForSecondOperand = true; currentOperator = op;
}
function calc(a,b,op) {
  switch(op){
    case '+': return a+b;
    case '-': return a-b;
    case '*': return a*b;
    case '/': return b===0 ? 'Error' : a/b;
  }
  return b;
}
function handleEquals() {
  if (!currentOperator || waitingForSecondOperand) return;
  const val = parseFloat(displayValue);
  let res = calc(firstOperand, val, currentOperator);
  if (res === 'Error') {
    displayValue = 'Error';
  } else {
    displayValue = parseFloat(res.toFixed(7)).toString();
    // 大爆発
    const r = display.getBoundingClientRect();
    const centerX = r.left + r.width/2;
    const centerY = r.top + r.height/2;
    createExplosion(centerX, centerY, 110, 8.5);
    createExplosion(centerX, centerY, 70, 5, '#f59e0b');
    bigBoomShake();
    display.classList.add('big-flash');
    setTimeout(() => display.classList.remove('big-flash'), 400);
  }
  firstOperand = null; currentOperator = null; waitingForSecondOperand = true;
  updateDisplay();
}
function resetCalc() { displayValue = '0'; firstOperand = null; waitingForSecondOperand = false; currentOperator = null; updateDisplay(); }
function toggleSign() {
  if (displayValue !== '0' && displayValue !== 'Error') displayValue = displayValue.startsWith('-') ? displayValue.slice(1) : '-' + displayValue;
  updateDisplay();
}
function percent() { displayValue = (parseFloat(displayValue)/100).toString(); updateDisplay(); }

// ボタン
function setupButtons() {
  document.querySelectorAll('.calc-btn').forEach(btn => {
    const handler = (e) => {
      // 爆発
      const r = btn.getBoundingClientRect();
      createExplosion(r.left + r.width/2, r.top + r.height/2, 28, 4.5);
      
      // リップル
      const ripple = document.createElement('span');
      ripple.classList.add('ripple');
      const size = Math.max(r.width, r.height) * 1.3;
      ripple.style.width = ripple.style.height = `${size}px`;
      ripple.style.left = `${e.clientX - r.left - size/2}px`;
      ripple.style.top = `${e.clientY - r.top - size/2}px`;
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
      
      // 処理
      if (btn.dataset.value) {
        if (btn.dataset.value === '.') inputDecimal();
        else inputDigit(btn.dataset.value);
      } else if (btn.dataset.operator) handleOperator(btn.dataset.operator);
      else if (btn.dataset.action) {
        const a = btn.dataset.action;
        if (a==='clear') resetCalc();
        if (a==='sign') toggleSign();
        if (a==='percent') percent();
        if (a==='equals') handleEquals();
      }
    };
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      if (e.changedTouches.length > 0) {
        const touch = e.changedTouches[0];
        handler({clientX: touch.clientX, clientY: touch.clientY, currentTarget: btn});
      }
    });
  });
}

function init() {
  initParticles();
  updateParticles();
  setupButtons();
  updateDisplay();
  
  // 起動爆発
  setTimeout(() => {
    const r = display.getBoundingClientRect();
    createExplosion(r.left + r.width/2, r.top + r.height/2, 40, 3);
  }, 400);
}
init();
</script>
</body>
</html>
