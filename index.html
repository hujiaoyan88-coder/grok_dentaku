<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💥 GROK BOOM CALC 💥</title>
  <link rel="icon" href="icon.png" />
<link rel="apple-touch-icon" href="icon.png" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .display { font-family: 'Space Grotesk', monospace; }
  
  .calc-btn {
    position: relative; overflow: hidden;
    transition: transform 0.1s cubic-bezier(0.23,1,0.32,1);
    backdrop-filter: blur(16px);
  }
  .calc-btn:active {
    transform: scale(0.88);
    backdrop-filter: blur(24px);
  }
  
  /* ぐるぐる光る円 */
  .glow-circle {
    position: absolute; border-radius: 50%;
    border: 3px solid rgba(103, 232, 249, 0.9);
    box-shadow: 0 0 20px rgba(103, 232, 249, 1),
                inset 0 0 15px rgba(103, 232, 249, 0.6);
    animation: glow-spin 0.65s linear forwards;
    pointer-events: none;
    z-index: 50;
  }
  @keyframes glow-spin {
    0% { transform: scale(0.2) rotate(0deg); opacity: 0.9; }
    50% { opacity: 0.7; }
    100% { transform: scale(4.5) rotate(180deg); opacity: 0; }
  }
  
  .big-flash { animation: big-flash-anim 0.45s ease; }
  @keyframes big-flash-anim {
    0% { filter: brightness(1); }
    30% { filter: brightness(4) saturate(3); }
    100% { filter: brightness(1); }
  }
  
  .earthquake { animation: earthquake-anim 0.55s ease; }
  @keyframes earthquake-anim {
    0%,100% { transform: translate(0,0); }
    10% { transform: translate(-8px, -4px); }
    20% { transform: translate(8px, 5px); }
    30% { transform: translate(-7px, 3px); }
    40% { transform: translate(7px, -5px); }
    50% { transform: translate(-5px, 3px); }
    60% { transform: translate(5px, -3px); }
  }
</style>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-3">
  <div id="main-container" class="w-full max-w-[360px]">
    <div class="flex items-center gap-2 mb-3 px-1">
      <div class="text-4xl">💥</div>
      <div>
        <h1 class="text-3xl font-black tracking-tighter text-white">GROK</h1>
        <h2 class="text-xl font-bold tracking-[-1px] bg-gradient-to-r from-cyan-300 to-sky-400 bg-clip-text text-transparent -mt-1">BOOM CALC</h2>
      </div>
    </div>

    <div class="relative bg-zinc-900/90 backdrop-blur-2xl border border-cyan-400/40 rounded-3xl p-5 shadow-2xl">
      <canvas id="particles" class="absolute inset-0 rounded-3xl pointer-events-none z-50"></canvas>
      
      <div id="display" 
           class="display relative z-10 h-24 flex items-end justify-end px-6 text-right text-5xl font-black tracking-[-3px] bg-black/60 backdrop-blur-xl rounded-2xl border border-cyan-400/30 mb-6 text-white">
        0
      </div>

      <div class="relative z-20 grid grid-cols-4 gap-3">
        <button class="calc-btn bg-zinc-800/80 hover:bg-zinc-700/80 text-zinc-200 text-xl py-5 rounded-2xl border border-white/10" data-action="clear">AC</button>
        <button class="calc-btn bg-zinc-800/80 hover:bg-zinc-700/80 text-zinc-200 text-xl py-5 rounded-2xl border border-white/10" data-action="sign">±</button>
        <button class="calc-btn bg-zinc-800/80 hover:bg-zinc-700/80 text-zinc-200 text-xl py-5 rounded-2xl border border-white/10" data-action="percent">%</button>
        <button class="calc-btn bg-cyan-950/70 hover:bg-cyan-900/70 text-cyan-300 text-3xl py-5 rounded-2xl border border-cyan-400/30" data-operator="/">÷</button>

        <button class="calc-btn bg-zinc-800/80 hover:bg-zinc-700/80 text-white text-3xl py-5 rounded-2xl border border-white/10" data-value="7">7</button>
        <button class="calc-btn bg-zinc-800/80 hover:bg-zinc-700/80 text-white text-3xl py-5 rounded-2xl border border-white/10" data-value="8">8</button>
        <button class="calc-btn bg-zinc-800/80 hover:bg-zinc-700/80 text-white text-3xl py-5 rounded-2xl border border-white/10" data-value="9">9</button>
        <button class="calc-btn bg-cyan-950/70 hover:bg-cyan-900/70 text-cyan-300 text-3xl py-5 rounded-2xl border border-cyan-400/30" data-operator="*">×</button>

        <button class="calc-btn bg-zinc-800/80 hover:bg-zinc-700/80 text-white text-3xl py-5 rounded-2xl border border-white/10" data-value="4">4</button>
        <button class="calc-btn bg-zinc-800/80 hover:bg-zinc-700/80 text-white text-3xl py-5 rounded-2xl border border-white/10" data-value="5">5</button>
        <button class="calc-btn bg-zinc-800/80 hover:bg-zinc-700/80 text-white text-3xl py-5 rounded-2xl border border-white/10" data-value="6">6</button>
        <button class="calc-btn bg-cyan-950/70 hover:bg-cyan-900/70 text-cyan-300 text-3xl py-5 rounded-2xl border border-cyan-400/30" data-operator="-">−</button>

        <button class="calc-btn bg-zinc-800/80 hover:bg-zinc-700/80 text-white text-3xl py-5 rounded-2xl border border-white/10" data-value="1">1</button>
        <button class="calc-btn bg-zinc-800/80 hover:bg-zinc-700/80 text-white text-3xl py-5 rounded-2xl border border-white/10" data-value="2">2</button>
        <button class="calc-btn bg-zinc-800/80 hover:bg-zinc-700/80 text-white text-3xl py-5 rounded-2xl border border-white/10" data-value="3">3</button>
        <button class="calc-btn bg-cyan-950/70 hover:bg-cyan-900/70 text-cyan-300 text-3xl py-5 rounded-2xl border border-cyan-400/30" data-operator="+">+</button>

        <button class="calc-btn bg-zinc-800/80 hover:bg-zinc-700/80 text-white text-3xl py-5 rounded-2xl border border-white/10 col-span-2" data-value="0">0</button>
        <button class="calc-btn bg-zinc-800/80 hover:bg-zinc-700/80 text-white text-3xl py-5 rounded-2xl border border-white/10" data-value=".">.</button>
        <button class="calc-btn bg-gradient-to-br from-cyan-400 to-sky-400 text-zinc-950 text-4xl font-black py-5 rounded-2xl shadow-[0_0_25px_#67e8f9] border border-cyan-300" data-action="equals">=</button>
      </div>
    </div>
  </div>

<script>
// パーティクル・ロジックなどは前回と同じ（省略せず全部入ってる）
let canvas, ctx, particles = [];
function initParticles() {
  canvas = document.getElementById('particles');
  ctx = canvas.getContext('2d');
  const resize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
  resize();
  window.addEventListener('resize', resize);
  
  for (let i = 0; i < 35; i++) {
    particles.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.5, size:Math.random()*2+1, life:200, maxLife:200, color:'#67e8f9', gravity:0.03});
  }
}
function createExplosion(x, y, count=45, speed=6) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const vel = Math.random() * speed + 2;
    particles.push({x, y, vx:Math.cos(angle)*vel, vy:Math.sin(angle)*vel - 2, size:Math.random()*3.5+1.5, life:38+Math.random()*22, maxLife:60, color:Math.random()>0.6?'#a5f3fc':'#67e8f9', gravity:0.08});
  }
}
function updateParticles() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.gravity;
    p.life--;
    if (p.life <= 0) { particles.splice(i,1); continue; }
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a * 0.95;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 15; ctx.shadowColor = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  requestAnimationFrame(updateParticles);
}

function bigBoomShake() {
  const c = document.getElementById('main-container');
  c.classList.add('earthquake');
  setTimeout(() => c.classList.remove('earthquake'), 600);
}

let displayValue = '0', firstOperand = null, waitingForSecondOperand = false, currentOperator = null;
const display = document.getElementById('display');
function updateDisplay() { display.textContent = displayValue; }

function inputDigit(d) {
  if (waitingForSecondOperand) { displayValue = d; waitingForSecondOperand = false; }
  else displayValue = displayValue === '0' ? d : displayValue + d;
  updateDisplay();
}
function inputDecimal() {
  if (waitingForSecondOperand) displayValue = '0.';
  else if (!displayValue.includes('.')) displayValue += '.';
  waitingForSecondOperand = false;
  updateDisplay();
}
function handleOperator(op) {
  const val = parseFloat(displayValue);
  if (currentOperator && waitingForSecondOperand) { currentOperator = op; return; }
  if (firstOperand === null) firstOperand = val;
  else if (currentOperator) {
    const res = calc(firstOperand, val, currentOperator);
    displayValue = res === 'Error' ? 'Error' : parseFloat(res.toFixed(7)).toString();
    firstOperand = res === 'Error' ? null : res;
    updateDisplay();
  }
  waitingForSecondOperand = true; currentOperator = op;
}
function calc(a,b,op) {
  switch(op){ case '+': return a+b; case '-': return a-b; case '*': return a*b; case '/': return b===0 ? 'Error' : a/b; }
  return b;
}
function handleEquals() {
  if (!currentOperator || waitingForSecondOperand) return;
  const val = parseFloat(displayValue);
  let res = calc(firstOperand, val, currentOperator);
  if (res === 'Error') {
    displayValue = 'Error';
  } else {
    displayValue = parseFloat(res.toFixed(7)).toString();
    const r = display.getBoundingClientRect();
    const cx = r.left + r.width/2;
    const cy = r.top + r.height/2;
    createExplosion(cx, cy, 120, 9);
    createExplosion(cx, cy, 70, 5);
    bigBoomShake();
    display.classList.add('big-flash');
    setTimeout(() => display.classList.remove('big-flash'), 400);
  }
  firstOperand = null; currentOperator = null; waitingForSecondOperand = true;
  updateDisplay();
}
function resetCalc() { displayValue = '0'; firstOperand = null; waitingForSecondOperand = false; currentOperator = null; updateDisplay(); }
function toggleSign() {
  if (displayValue !== '0' && displayValue !== 'Error') displayValue = displayValue.startsWith('-') ? displayValue.slice(1) : '-' + displayValue;
  updateDisplay();
}
function percent() { displayValue = (parseFloat(displayValue)/100).toString(); updateDisplay(); }

function createGlowCircle(e, btn) {
  const r = btn.getBoundingClientRect();
  const circle = document.createElement('div');
  circle.classList.add('glow-circle');
  const size = Math.max(r.width, r.height) * 0.8;
  circle.style.width = circle.style.height = `${size}px`;
  circle.style.left = `${e.clientX - r.left - size/2}px`;
  circle.style.top = `${e.clientY - r.top - size/2}px`;
  btn.appendChild(circle);
  setTimeout(() => circle.remove(), 700);
}

function setupButtons() {
  document.querySelectorAll('.calc-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      createGlowCircle(e, btn);
      const rect = btn.getBoundingClientRect();
      createExplosion(rect.left + rect.width/2, rect.top + rect.height/2, 28, 4.5);
      
      if (btn.dataset.value) {
        if (btn.dataset.value === '.') inputDecimal();
        else inputDigit(btn.dataset.value);
      } else if (btn.dataset.operator) handleOperator(btn.dataset.operator);
      else if (btn.dataset.action) {
        const a = btn.dataset.action;
        if (a==='clear') resetCalc();
        if (a==='sign') toggleSign();
        if (a==='percent') percent();
        if (a==='equals') handleEquals();
      }
    });
  });
}

function init() {
  initParticles();
  updateParticles();
  setupButtons();
  updateDisplay();
  
  setTimeout(() => {
    const r = display.getBoundingClientRect();
    createExplosion(r.left + r.width/2, r.top + r.height/2, 40, 3);
  }, 400);
}
init();
</script>
</body>
</html>
