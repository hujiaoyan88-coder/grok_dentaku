<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💥 GROK BOOM CALC 💥</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .display { font-family: 'Space Grotesk', monospace; }
  
  .calc-btn {
    position: relative; overflow: hidden;
    transition: transform 0.1s cubic-bezier(0.23,1,0.32,1), box-shadow 0.1s;
  }
  .calc-btn:active { transform: scale(0.85) !important; }
  
  .ripple {
    position: absolute; border-radius: 50%;
    background: rgba(255,215,0,0.7);
    animation: ripple-boom 0.6s linear forwards;
    pointer-events: none;
  }
  @keyframes ripple-boom {
    to { transform: scale(5); opacity: 0; }
  }
  
  .big-flash {
    animation: big-flash-anim 0.4s ease;
  }
  @keyframes big-flash-anim {
    0% { filter: brightness(1); }
    20% { filter: brightness(3) saturate(2); }
    100% { filter: brightness(1); }
  }
  
  .earthquake {
    animation: earthquake-anim 0.6s ease;
  }
  @keyframes earthquake-anim {
    0%,100% { transform: translate(0,0); }
    10% { transform: translate(-12px, -6px); }
    20% { transform: translate(12px, 8px); }
    30% { transform: translate(-10px, 4px); }
    40% { transform: translate(10px, -8px); }
    50% { transform: translate(-8px, 6px); }
    60% { transform: translate(8px, -4px); }
    70% { transform: translate(-6px, 4px); }
    80% { transform: translate(6px, -2px); }
    90% { transform: translate(-2px, 2px); }
  }
</style>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-4 overflow-hidden">
  <div id="main-container" class="w-full max-w-[400px]">
    <div class="flex items-center gap-3 mb-4 px-2">
      <div class="text-5xl">💥</div>
      <div>
        <h1 class="text-4xl font-black tracking-[-2px] text-white">GROK</h1>
        <h2 class="text-2xl font-bold tracking-tighter bg-gradient-to-r from-amber-400 to-yellow-500 bg-clip-text text-transparent -mt-2">BOOM CALC</h2>
      </div>
    </div>

    <div class="relative bg-zinc-900/95 backdrop-blur-2xl border border-amber-500/30 rounded-3xl p-7 shadow-[0_0_60px_rgba(245,158,11,0.15)]">
      <!-- 超派手パーティクル -->
      <canvas id="particles" class="absolute inset-0 rounded-3xl pointer-events-none z-0"></canvas>
      
      <!-- ディスプレイ -->
      <div id="display" 
           class="display relative z-10 h-32 flex items-end justify-end px-8 text-right text-[64px] font-black tracking-[-4px] bg-black/70 rounded-3xl border border-amber-500/20 mb-8 text-white overflow-hidden shadow-inner">
        0
      </div>

      <!-- ボタン群 -->
      <div class="relative z-10 grid grid-cols-4 gap-4">
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-zinc-200 text-2xl py-7 rounded-2xl font-semibold" data-action="clear">AC</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-zinc-200 text-2xl py-7 rounded-2xl font-semibold" data-action="sign">±</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-zinc-200 text-2xl py-7 rounded-2xl font-semibold" data-action="percent">%</button>
        <button class="calc-btn bg-orange-950 hover:bg-orange-900 text-orange-400 text-4xl py-7 rounded-2xl font-light" data-operator="/">÷</button>

        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-white text-4xl py-7 rounded-2xl" data-value="7">7</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-white text-4xl py-7 rounded-2xl" data-value="8">8</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-white text-4xl py-7 rounded-2xl" data-value="9">9</button>
        <button class="calc-btn bg-orange-950 hover:bg-orange-900 text-orange-400 text-4xl py-7 rounded-2xl font-light" data-operator="*">×</button>

        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-white text-4xl py-7 rounded-2xl" data-value="4">4</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-white text-4xl py-7 rounded-2xl" data-value="5">5</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-white text-4xl py-7 rounded-2xl" data-value="6">6</button>
        <button class="calc-btn bg-orange-950 hover:bg-orange-900 text-orange-400 text-4xl py-7 rounded-2xl font-light" data-operator="-">−</button>

        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-white text-4xl py-7 rounded-2xl" data-value="1">1</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-white text-4xl py-7 rounded-2xl" data-value="2">2</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-white text-4xl py-7 rounded-2xl" data-value="3">3</button>
        <button class="calc-btn bg-orange-950 hover:bg-orange-900 text-orange-400 text-4xl py-7 rounded-2xl font-light" data-operator="+">+</button>

        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-white text-4xl py-7 rounded-2xl col-span-2" data-value="0">0</button>
        <button class="calc-btn bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-white text-4xl py-7 rounded-2xl" data-value=".">.</button>
        <button class="calc-btn bg-gradient-to-br from-yellow-400 via-amber-400 to-orange-500 hover:from-yellow-300 text-zinc-950 text-5xl font-black py-7 rounded-2xl shadow-[0_10px_30px_rgb(245,158,11)]" data-action="equals">=</button>
      </div>
    </div>
    
    <p class="text-center text-xs text-amber-400/60 mt-4 tracking-[3px]">REALITY IGNORED • MAXIMUM BOOM</p>
  </div>

<script>
// ==================== 超どかーん パーティクルシステム ====================
let canvas, ctx, particles = [];

function initParticles() {
  canvas = document.getElementById('particles');
  ctx = canvas.getContext('2d');
  
  function resize() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // 背景常時パーティクル（増量）
  particles = [];
  for (let i = 0; i < 45; i++) {
    particles.push(createParticle(
      Math.random() * canvas.width,
      Math.random() * canvas.height,
      (Math.random() - 0.5) * 0.6,
      (Math.random() - 0.5) * 0.6,
      Math.random() * 2.5 + 1,
      180 + Math.random() * 150,
      '#fcd34d'
    ));
  }
}

function createParticle(x, y, vx, vy, size, life, color) {
  return { x, y, vx, vy, size, life, maxLife: life, color, gravity: 0.02 };
}

function createExplosion(x, y, count = 60, speed = 5, color = '#fcd34d') {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const vel = Math.random() * speed + 2;
    const p = createParticle(
      x + (Math.random() - 0.5) * 15,
      y + (Math.random() - 0.5) * 15,
      Math.cos(angle) * vel,
      Math.sin(angle) * vel - 1.5,
      Math.random() * 4 + 1.5,
      35 + Math.random() * 25,
      (Math.random() > 0.7) ? '#fef08c' : color
    );
    p.gravity = 0.08;
    particles.push(p);
  }
}

function updateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity || 0.02;
    p.life--;
    
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha * 0.9;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  
  // 背景パーティクル補充
  if (particles.length < 50 && Math.random() < 0.4) {
    particles.push(createParticle(
      Math.random() * canvas.width,
      Math.random() * canvas.height * 0.6,
      (Math.random() - 0.5) * 0.5,
      (Math.random() - 0.5) * 0.5,
      Math.random() * 2 + 0.8,
      160,
      '#fcd34d'
    ));
  }
  
  requestAnimationFrame(updateParticles);
}

// ==================== 画面どかーん シェイク ====================
function bigBoomShake() {
  const container = document.getElementById('main-container');
  container.classList.add('earthquake');
  setTimeout(() => container.classList.remove('earthquake'), 650);
  
  // 画面全体フラッシュ
  const flash = document.createElement('div');
  flash.style.cssText = 'position:fixed;inset:0;background:rgba(245,158,11,0.25);pointer-events:none;z-index:9999;';
  document.body.appendChild(flash);
  setTimeout(() => flash.style.transition = 'opacity 0.3s', 50);
  setTimeout(() => {
    flash.style.opacity = '0';
    setTimeout(() => flash.remove(), 300);
  }, 150);
}

// ==================== 電卓ロジック（実用性は最低限） ====================
let displayValue = '0';
let firstOperand = null;
let waitingForSecondOperand = false;
let currentOperator = null;
const displayEl = document.getElementById('display');

function updateDisplay() {
  displayEl.textContent = displayValue;
}

function inputDigit(digit) {
  if (waitingForSecondOperand) {
    displayValue = digit;
    waitingForSecondOperand = false;
  } else {
    displayValue = displayValue === '0' ? digit : displayValue + digit;
  }
  updateDisplay();
}

function inputDecimal() {
  if (waitingForSecondOperand) {
    displayValue = '0.';
    waitingForSecondOperand = false;
  } else if (!displayValue.includes('.')) {
    displayValue += '.';
  }
  updateDisplay();
}

function handleOperator(op) {
  const val = parseFloat(displayValue);
  if (currentOperator && waitingForSecondOperand) {
    currentOperator = op;
    return;
  }
  if (firstOperand === null) {
    firstOperand = val;
  } else if (currentOperator) {
    const res = calculate(firstOperand, val, currentOperator);
    displayValue = res === 'Error' ? 'Error' : parseFloat(res.toFixed(7)).toString();
    firstOperand = res === 'Error' ? null : res;
    updateDisplay();
  }
  waitingForSecondOperand = true;
  currentOperator = op;
}

function calculate(a, b, op) {
  if (op === '+') return a + b;
  if (op === '-') return a - b;
  if (op === '*') return a * b;
  if (op === '/') return b === 0 ? 'Error' : a / b;
  return b;
}

function handleEquals() {
  if (!currentOperator || waitingForSecondOperand) return;
  
  const val = parseFloat(displayValue);
  let result = calculate(firstOperand, val, currentOperator);
  
  if (result === 'Error') {
    displayValue = 'Error';
  } else {
    displayValue = parseFloat(result.toFixed(7)).toString();
    // ★★★ 最大級どかーん！ ★★★
    const rect = displayEl.getBoundingClientRect();
    createExplosion(rect.left + rect.width/2, rect.top + rect.height/2, 120, 9, '#fef08c');
    createExplosion(rect.left + rect.width/2, rect.top + rect.height/2, 80, 6, '#f59e0b');
    bigBoomShake();
    displayEl.classList.add('big-flash');
    setTimeout(() => displayEl.classList.remove('big-flash'), 450);
  }
  
  firstOperand = null;
  currentOperator = null;
  waitingForSecondOperand = true;
  updateDisplay();
}

function resetCalc() {
  displayValue = '0';
  firstOperand = null;
  waitingForSecondOperand = false;
  currentOperator = null;
  updateDisplay();
}

function toggleSign() {
  if (displayValue !== '0' && displayValue !== 'Error') {
    displayValue = displayValue.startsWith('-') ? displayValue.slice(1) : '-' + displayValue;
    updateDisplay();
  }
}

function percent() {
  displayValue = (parseFloat(displayValue) / 100).toString();
  updateDisplay();
}

// ==================== 爆発エフェクト付きボタン処理 ====================
function setupButtons() {
  document.querySelectorAll('.calc-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      // リップル
      const ripple = document.createElement('span');
      ripple.classList.add('ripple');
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 1.2;
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 700);
      
      // ボタン位置で小爆発
      const btnRect = btn.getBoundingClientRect();
      createExplosion(
        btnRect.left + btnRect.width/2, 
        btnRect.top + btnRect.height/2, 
        35, 4.5
      );
      
      // 音
      playBoomSound(btn.dataset.action === 'equals');
      
      // アクション
      if (btn.dataset.value) {
        if (btn.dataset.value === '.') inputDecimal();
        else inputDigit(btn.dataset.value);
      } else if (btn.dataset.operator) {
        handleOperator(btn.dataset.operator);
      } else if (btn.dataset.action) {
        const act = btn.dataset.action;
        if (act === 'clear') resetCalc();
        if (act === 'sign') toggleSign();
        if (act === 'percent') percent();
        if (act === 'equals') handleEquals();
      }
    });
  });
}

// ==================== 爆発音 ====================
function playBoomSound(isBig = false) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // 低音ドーン
    const osc1 = ctx.createOscillator();
    const gain1 = ctx.createGain();
    osc1.type = 'sawtooth';
    osc1.frequency.value = isBig ? 45 : 80;
    gain1.gain.value = isBig ? 0.6 : 0.35;
    
    // 高音キラキラ
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.type = 'sine';
    osc2.frequency.value = isBig ? 1200 : 850;
    gain2.gain.value = isBig ? 0.25 : 0.12;
    
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1800;
    
    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gain1);
    filter.connect(gain2);
    gain1.connect(ctx.destination);
    gain2.connect(ctx.destination);
    
    osc1.start();
    osc2.start();
    
    const dur = isBig ? 0.55 : 0.18;
    gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur * 0.7);
    
    setTimeout(() => {
      osc1.stop();
      osc2.stop();
    }, dur * 1000 + 100);
  } catch(e) {}
}

// キーボード対応（簡易）
function setupKeyboard() {
  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
    if (e.key === '.') inputDecimal();
    if (['+','-','*','/'].includes(e.key)) handleOperator(e.key);
    if (e.key === 'Enter' || e.key === '=') handleEquals();
    if (e.key.toLowerCase() === 'c') resetCalc();
  });
}

// ==================== 起動 ====================
function init() {
  initParticles();
  updateParticles();
  setupButtons();
  setupKeyboard();
  updateDisplay();
  
  // 起動時にもちょっとどかーん
  setTimeout(() => {
    const disp = document.getElementById('display');
    const r = disp.getBoundingClientRect();
    createExplosion(r.left + r.width/2, r.top + r.height/2, 50, 3);
  }, 800);
}

init();
</script>
</body>
</html>
